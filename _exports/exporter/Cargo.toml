[package]
name = "codex-crates-exporter"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
pathdiff = "0.2"
semver = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
toml_edit = "0.25"

[[bin]]
name = "codex-crates-exporter"
path = "src/main.rs"
