name: Check sync freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 _exports/sync.py --freshness-hours 48
